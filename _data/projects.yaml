# Active projects (shown first)

- title: Nigeria Road Inventory Initiative
  subtitle: Our first project — from one local government area to a national dataset
  group: active
  image: images/road-inventory-concept-wide.png
  link: projects/road-inventory
  description: Nigeria has no comprehensive, consistent inventory of its roads, so agencies plan without knowing what is out there and researchers cannot model risk. We are building one, starting with a pilot local government area and scaling deliberately toward national coverage, published as open data.
  tags:
    - road safety
    - data

# Program areas. Group must be one of:
# injury-prevention, smart-cities, resilient-communities

- title: Safe school zones
  subtitle: Protecting children on the way to and from school
  group: injury-prevention
  image: images/photo-road-safety-lagos.jpg
  description: Road crashes are the leading cause of death for children over five. We work with schools, parents and local governments to audit school routes, lower speeds, add crossings and footpaths, and measure the change in speeds, near-misses and injuries — a proven, low-cost model that funders back and communities can maintain.
  tags:
    - children
    - speed management

- title: Motorcycle and rider safety
  subtitle: Young riders, passengers and the informal transport workforce
  group: injury-prevention
  image: images/photo-road-safety-lagos.jpg
  description: Commercial motorcycles move millions of people across African cities and account for a growing share of serious injuries, most of them young men. We partner with riders' unions on helmet access and quality, rider training, and safer pick-up points, and evaluate what changes behavior and reduces head injuries.
  tags:
    - motorcycles
    - young people

- title: Pedestrians, traders and older adults
  subtitle: Safety for the people who never get behind the wheel
  group: injury-prevention
  image: images/photo-road-safety-lagos.jpg
  description: Street traders, people crossing arterial roads and older adults face the highest risk and are rarely counted. We map where they are hurt, test safe-system fixes such as speed humps, refuge islands, lighting and market-edge design, and build the local crash and injury data that makes the problem visible.
  tags:
    - vulnerable road users
    - safe system

- title: Post-crash care and emergency response
  subtitle: Surviving the first hour
  group: injury-prevention
  image: images/photo-road-safety-lagos.jpg
  description: Many road deaths happen after the crash, not at it. We study emergency response times, first-responder training and trauma referral pathways with health partners, and pilot low-cost dispatch and bystander-care programs so that a survivable injury stays survivable.
  tags:
    - post-crash care
    - health systems

- title: Low-cost sensing and open data
  subtitle: Seeing the city so it can be fixed
  group: smart-cities
  image: images/photo-nairobi-expressway.jpg
  description: Most cities in the Global South make transport decisions with almost no data. We deploy affordable sensors, camera-based counting and mobile data collection to measure traffic, speeds, pedestrian flows and air quality, and publish the results as open data that residents, planners and journalists can use.
  tags:
    - smart cities
    - open data

- title: Safer streets through technology
  subtitle: Lighting, crossings and signals that serve people
  group: smart-cities
  image: images/photo-nairobi-expressway.jpg
  description: Street lighting, pedestrian signals and smarter intersections are among the most cost-effective safety investments a city can make. We pilot deployments with local governments, evaluate their effect on injuries and how people use the street at night, and produce the evidence cities need to scale them.
  tags:
    - smart cities
    - infrastructure

- title: Digital tools for local planners
  subtitle: Putting decision support in the hands of local government
  group: smart-cities
  image: images/photo-nairobi-expressway.jpg
  description: Local governments rarely have the analysts or software to prioritize where to act. We build simple GIS dashboards and risk-mapping tools on top of open data, train local staff to use them, and hand them over — so technology deployment ends with a capable agency, not a vendor contract.
  tags:
    - smart cities
    - capacity building

- title: Flood-ready streets
  subtitle: Keeping communities connected when the water rises
  group: resilient-communities
  image: images/photo-flooded-road-lagos.jpg
  description: Seasonal flooding closes roads, cuts children off from school and delays emergency care in the same neighborhoods every year. We map which routes and crossings fail first, work with residents on detours and early warnings, and identify the drainage and road fixes that restore access fastest.
  tags:
    - flooding
    - resilience

- title: Heat, weather and daily mobility
  subtitle: Adapting how people move to the climate they have
  group: resilient-communities
  image: images/photo-flooded-road-lagos.jpg
  description: Extreme heat and storms change when and how people travel and who gets hurt. We study how weather shifts risk for people walking, riding and waiting for transport, and design shade, shelter, timing and warning measures with communities that keep everyday journeys safe.
  tags:
    - climate
    - public health

- title: Community crash and hazard reporting
  subtitle: Data from the people who live with the risk
  group: resilient-communities
  image: images/photo-flooded-road-lagos.jpg
  description: Official crash records miss most injuries and almost all hazards. We build simple ways for residents, riders and health workers to report crashes, flooding and dangerous locations, and turn those reports into maps that local governments and funders act on.
  tags:
    - community data
    - participatory
