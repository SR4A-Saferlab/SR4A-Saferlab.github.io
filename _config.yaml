# site properties and page defaults
title: SAFER Lab
subtitle: Safety and Resilience for All
description: SAFER Lab is the research arm of SR4A (Safety and Resilience for All) — evidence, tools and training for safer roads, climate-resilient transport, and smart cities that serve everyone.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: info@sr4a.com
  github: SR4A-Saferlab
  home-page: https://sr4a.com

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
